# Commit this file to the sandbox default branch through a normal pull request.
# Promote never writes this file. The kickoff push of `.aichitect/run` starts it.
name: AiChitect coder
on:
  push:
    paths:
      - '.aichitect/run'

permissions:
  contents: write
  pull-requests: write

jobs:
  code:
    if: github.ref != format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Implement the kickoff with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          GOOGLE_GENAI_MODEL: gemini-3.5-flash-lite
        run: |
          set -euo pipefail
          sed 's/^          //' > /tmp/apply_kickoff.py << 'PY'
          import json, os, pathlib, urllib.error, urllib.request

          brief = pathlib.Path(".aichitect/run").read_text(encoding="utf-8")
          model = os.environ["GOOGLE_GENAI_MODEL"]
          key = os.environ["GEMINI_API_KEY"]
          prompt = (
              "You are the coder on this git branch. The repository is almost empty. "
              "Implement the kickoff as real source files a person can open and run. "
              "Do not describe the work. Do not write .git, .github, or .aichitect paths.\n\n"
              + brief
          )
          body = {
              "contents": [{"parts": [{"text": prompt}]}],
              "generationConfig": {
                  "temperature": 0.2,
                  "maxOutputTokens": 8192,
                  "responseMimeType": "application/json",
                  "responseSchema": {
                      "type": "object",
                      "properties": {
                          "summary": {"type": "string"},
                          "files": {
                              "type": "array",
                              "items": {
                                  "type": "object",
                                  "properties": {
                                      "path": {"type": "string"},
                                      "content": {"type": "string"},
                                  },
                                  "required": ["path", "content"],
                              },
                          },
                      },
                      "required": ["summary", "files"],
                  },
              },
          }
          request = urllib.request.Request(
              "https://generativelanguage.googleapis.com/v1beta/models/%s:generateContent" % model,
              data=json.dumps(body).encode(),
              headers={"Content-Type": "application/json", "x-goog-api-key": key},
              method="POST",
          )
          try:
              with urllib.request.urlopen(request, timeout=120) as response:
                  payload = json.load(response)
          except urllib.error.HTTPError as error:
              raise SystemExit(error.read().decode()[:2000])
          parts = payload.get("candidates", [{}])[0].get("content", {}).get("parts", [])
          text = "".join(part.get("text", "") for part in parts)
          if not text:
              raise SystemExit("Gemini returned no text\n" + json.dumps(payload)[:2000])
          data = json.loads(text)
          files = data.get("files") or []
          if not files:
              raise SystemExit("Gemini returned no files")
          root = pathlib.Path(".").resolve()
          written = []
          for item in files:
              rel = pathlib.PurePosixPath(str(item["path"]).replace("\\", "/").lstrip("/"))
              if not rel.parts or ".." in rel.parts or rel.parts[0] in {".git", ".github", ".aichitect"}:
                  raise SystemExit("refusing path %s" % item["path"])
              dest = (root / pathlib.Path(*rel.parts)).resolve()
              if root != dest and root not in dest.parents:
                  raise SystemExit("refusing path %s" % item["path"])
              content = item.get("content") or ""
              if not content.strip():
                  raise SystemExit("empty file %s" % item["path"])
              dest.parent.mkdir(parents=True, exist_ok=True)
              dest.write_text(content, encoding="utf-8")
              written.append(rel.as_posix())
          print(data.get("summary", ""))
          print("wrote " + ", ".join(written))
          PY
          python3 /tmp/apply_kickoff.py
          git config user.name "aichitect-coder"
          git config user.email "aichitect-coder@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "no file changes"; exit 1; }
          git commit -m "feat: implement kickoff"
          git push origin HEAD
