# Commit this file to the sandbox default branch through a normal pull request.
# Promote never writes this file. The kickoff push of `.aichitect/run` starts it.
name: AiChitect coder
on:
  push:
    paths:
      - '.aichitect/run'

permissions:
  contents: write
  pull-requests: write

jobs:
  code:
    if: github.ref != format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Implement the kickoff with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          GOOGLE_GENAI_MODEL: gemini-3.1-flash-lite
        run: |
          set -euo pipefail
          sed 's/^          //' > /tmp/apply_kickoff.py << 'PY'
          import json, os, pathlib, time, urllib.error, urllib.request

          brief = pathlib.Path(".aichitect/run").read_text(encoding="utf-8")
          model = os.environ["GOOGLE_GENAI_MODEL"]
          key = os.environ["GEMINI_API_KEY"]
          system = """You implement one approved story on this branch as a program a person can run on localhost. Return one JSON object. Each file has path and lines, and each entry in lines is exactly one source line. The kickoff is the whole requirement.

          Runnable slice
          - Include package.json with start and test scripts. npm test must pass with no network. The README must say the URL and port for npm start.
          - Serve a browser page at public/index.html. It is a full page: a heading, a label for each field in the kickoff, a submit button, and a message area for success or the validation error. Do not stop at a library class with no page.
          - Persist records in a SQLite database file at data/app.sqlite using only the sql.js package. Load that file on startup and write it after every save so a restart keeps the rows. Do not add the sqlite3 package or any native addon. Do not use a mock as the only store.
          - Expose the HTTP route named in the kickoff and connect the page, the route, and that database. A person can submit the form and see the saved record.
          - The server listens on process.env.PORT, and the default is 3010. The README URL is http://localhost:3010.
          - Read the expected bearer token from the TASK_TOKEN environment variable. The README tells the reader to set TASK_TOKEN=local-dev for localhost. Do not hardcode a password in source.

          File and code management
          - One responsibility per file, and at most six functions in a file. Split by responsibility when a file would do more.
          - Put the interface that callers and tests use in its own file. Put each implementation in its own file. Do not add a seam unless two implementations actually vary across it.
          - Name files and functions with the domain words from the kickoff. Do not add generic utils, helpers, or managers.
          - Prefer composition. Do not build inheritance hierarchies.
          - Choose a pattern only when the story needs that variation: Factory or Builder to create objects, Strategy to swap an algorithm, Adapter or Facade at a real boundary, State when behaviour changes with status. Skip a pattern that nothing varies across.
          - Design a deep module: a small interface that hides validation, rules, and storage. Callers learn the interface, not the body.
          - The repository module opens sql.js and the sqlite file. Tests pass a temporary file path into that module.
          - Return a result or raise a typed error. Do not report failure only with a boolean or a log line.

          Tests
          - Add one test file per module. Test through the interface, the same way a caller uses it. Do not test private helpers.
          - Cover every acceptance criterion: the success path, the rejected unauthenticated call, and each validation failure named in the kickoff.
          - The success test saves one valid task into a temporary sqlite database and reads that row back. A test that never touches the database is not enough.
          - Each test name states the situation and the expected outcome.
          - Tests run with the command in the project manifest, with no network and no real secrets.

          Security
          - When the story requires an authenticated caller, check that before any write. Fail closed.
          - Validate type, length, allowed values, and dates at the edge before anything is stored. Reject unexpected fields.
          - Do not concatenate untrusted input into queries, shell commands, file paths, or HTML. Pass parameters separately, and encode output that is rendered.
          - Do not put secrets, tokens, or passwords in source. Read configuration from the environment, and do not log credentials or full request bodies.

          Implementor
          - Write a short README.md: how to install, how to run, how to test, the module layout, and the one place a later story should extend.
          - Leave that extension point as a small interface so the next change does not rewrite these files.
          - Do not write .git, .github, or .aichitect paths.
          """
          prompt = "Implement this kickoff.\n\n" + brief
          body = {
              "systemInstruction": {"parts": [{"text": system}]},
              "contents": [{"parts": [{"text": prompt}]}],
              "generationConfig": {
                  "temperature": 0.2,
                  "maxOutputTokens": 32768,
                  "responseMimeType": "application/json",
                  "responseSchema": {
                      "type": "object",
                      "properties": {
                          "summary": {"type": "string"},
                          "files": {
                              "type": "array",
                              "items": {
                                  "type": "object",
                                  "properties": {
                                      "path": {"type": "string"},
                                      "lines": {"type": "array", "items": {"type": "string"}},
                                  },
                                  "required": ["path", "lines"],
                              },
                          },
                      },
                      "required": ["summary", "files"],
                  },
              },
          }
          def file_text(item):
              lines = item.get("lines") or []
              if lines:
                  return "\n".join(str(line) for line in lines)
              return str(item.get("content") or "")

          def quality_notes(files):
              notes = []
              texts = []
              saw_html = False
              for item in files:
                  rel = str(item.get("path") or "").replace("\\", "/")
                  content = file_text(item)
                  texts.append(content)
                  if rel.endswith("public/index.html"):
                      saw_html = True
                  if len(content) > 280 and content.count("\n") < 8:
                      notes.append(rel + " must be many lines, not one line")
              blob = "\n".join(texts)
              if not saw_html:
                  notes.append("add a multi-line public/index.html form")
              if "sql.js" not in blob:
                  notes.append("use the sql.js package and save data/app.sqlite")
              if "sqlite3" in blob:
                  notes.append("do not depend on the sqlite3 package")
              if "3010" not in blob:
                  notes.append("listen on process.env.PORT or 3010")
              if "create table" not in blob.lower():
                  notes.append("create a tasks table in sqlite")
              return notes

          def generate(model_name):
              request = urllib.request.Request(
                  "https://generativelanguage.googleapis.com/v1beta/models/%s:generateContent" % model_name,
                  data=json.dumps(body).encode(),
                  headers={"Content-Type": "application/json", "x-goog-api-key": key},
                  method="POST",
              )
              try:
                  response = urllib.request.urlopen(request, timeout=120)
                  loaded = json.load(response)
                  response.close()
                  return loaded, None
              except urllib.error.HTTPError as error:
                  return None, error

          payload = None
          last_error = "Gemini returned no text"
          for candidate in (model, "gemini-3.5-flash-lite"):
              got, error = generate(candidate)
              if not got and error is not None and error.code in (429, 503):
                  print("busy " + candidate)
                  time.sleep(12)
                  got, error = generate(candidate)
              if got:
                  payload = got
                  print("model " + candidate)
                  break
              if error is None:
                  continue
              detail = error.read().decode()[:2000]
              last_error = detail
              if error.code not in (429, 503):
                  raise SystemExit(detail)
          if not payload:
              raise SystemExit(last_error)
          parts = payload.get("candidates", [{}])[0].get("content", {}).get("parts", [])
          text = "".join(part.get("text", "") for part in parts)
          if not text:
              raise SystemExit("Gemini returned no text\n" + json.dumps(payload)[:2000])
          data = json.loads(text)
          files = data.get("files") or []
          if not files:
              raise SystemExit("Gemini returned no files")
          notes = quality_notes(files)
          if notes:
              print("quality " + "; ".join(notes))
              retry_text = prompt + "\n\nThe last answer failed review:\n- " + "\n- ".join(notes)
              body["contents"] = [{"parts": [{"text": retry_text}]}]
              got, error = generate(model)
              if not got and error is not None and error.code in (429, 503):
                  print("busy " + model)
                  time.sleep(12)
                  got, error = generate(model)
              if not got:
                  detail = error.read().decode()[:2000] if error is not None else last_error
                  raise SystemExit(detail)
              payload = got
              parts = payload.get("candidates", [{}])[0].get("content", {}).get("parts", [])
              text = "".join(part.get("text", "") for part in parts)
              if not text:
                  raise SystemExit("Gemini returned no text\n" + json.dumps(payload)[:2000])
              data = json.loads(text)
              files = data.get("files") or []
              if not files:
                  raise SystemExit("Gemini returned no files")
          root = pathlib.Path(".").resolve()
          written = []
          for item in files:
              rel = pathlib.PurePosixPath(str(item["path"]).replace("\\", "/").lstrip("/"))
              if not rel.parts or ".." in rel.parts or rel.parts[0] in {".git", ".github", ".aichitect"}:
                  raise SystemExit("refusing path %s" % item["path"])
              dest = (root / pathlib.Path(*rel.parts)).resolve()
              if root != dest and root not in dest.parents:
                  raise SystemExit("refusing path %s" % item["path"])
              content = file_text(item)
              if not content.strip():
                  raise SystemExit("empty file %s" % item["path"])
              dest.parent.mkdir(parents=True, exist_ok=True)
              dest.write_text(content, encoding="utf-8")
              written.append(rel.as_posix())
          print(data.get("summary", ""))
          print("wrote " + ", ".join(written))
          PY
          python3 /tmp/apply_kickoff.py
          git config user.name "aichitect-coder"
          git config user.email "aichitect-coder@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "no file changes"; exit 1; }
          git commit -m "feat: implement kickoff"
          git push origin HEAD
