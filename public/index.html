<h1>Refund Inquiry</h1>
<label>ID: <input id='id'></label>
<button onclick='submit()'>Submit</button>
<div id='msg'></div>
<script>
async function submit() {
  const res = await fetch('/refund-status', { method: 'POST', body: JSON.stringify({id: document.getElementById('id').value}), headers: {'x-user-group': 'customer', 'Content-Type': 'application/json'}});
  document.getElementById('msg').innerText = res.ok ? 'Success' : 'Error';
}
</script>
