<form id='taskForm'><input id='title' placeholder='Title'><input id='deadline' type='date'><select id='status'><option>pending</option><option>in-progress</option></select><button type='submit'>Submit</button></form><script>document.getElementById('taskForm').onsubmit = async (e) => {e.preventDefault();const res = await fetch('/tasks', {method:'POST',headers:{'Content-Type':'application/json','Authorization':'secret'},body:JSON.stringify({title:document.getElementById('title').value,deadline:document.getElementById('deadline').value,status:document.getElementById('status').value})});alert(res.ok ? 'Success' : 'Error');}</script>
